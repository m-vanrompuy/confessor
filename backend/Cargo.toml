[package]
name = "Confessor"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
firestore = "0.49.0"
gcp_auth = "0.12.7"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
reqwest = { version = "0.13.4", features = ["json"] }
rustls = { version = "0.23.41", features = ["ring"] }
serde = "1.0.228"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
futures = "0.3"
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"